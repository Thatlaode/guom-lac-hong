<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="css/font.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xem vật thể · Gươm Lạc Hồng</title>
<style>body{margin:0;background:#120c0b;color:#F1E9D6;font:14px "Segoe UI",system-ui,sans-serif;overflow:hidden}#top{position:fixed;left:10px;top:8px}#top b{color:#D5AD59;font-size:18px}.m{opacity:.7;font-size:12px}canvas{display:block}</style></head><body>
<div id="top"><b>Xem vật thể chiến thuật</b> <span class="m">· bụi cỏ · nhà tranh · cây · tảng đá · kéo chuột để xoay</span></div>
<script src="js/lib/three.min.js"></script><script src="js/lib/GLTFLoader.js"></script><script src="js/lib/SkeletonUtils.js"></script>
<script src="js/core.js"></script><script src="shared/rules.js"></script><script src="shared/props.js"></script><script src="js/palette.js"></script><script src="js/rig.js"></script><script src="js/props.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(PAL.suong);S.fog=new THREE.Fog(PAL.suong,30,80);
const C=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,200);let yaw=0.6,dist=+(new URLSearchParams(location.search).get('dist'))||22,pit=0.45;
S.add(new THREE.HemisphereLight(0xC9D6DA,PAL.datAm,0.62));const sun=new THREE.DirectionalLight(0xFFE6C0,1.0);sun.position.set(-10,16,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});S.add(sun);
const g=new THREE.Mesh(new THREE.CircleGeometry(40,48),new THREE.MeshStandardMaterial({color:PAL.coTuNhien,roughness:1}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;S.add(g);
const list=[[1,'nha',0,0,3.2,0.4,1],[2,'bui',-7,3,2,0,1],[3,'bui',6.5,4,2.2,1,2],[4,'cay',-6,-5,0.55,0,0],[5,'cay',7,-4,0.55,1,1],[6,'cay',0,-8,0.55,2,3],[7,'da',-9,-1,1.2,0.5,0],[8,'da',9,1,1,1,3],[9,'bui',2,7,1.8,2,3]];
const V=new PropsView(S,list,{groundY:()=>0});
let drag=null;R.domElement.onpointerdown=e=>drag={x:e.clientX,y:e.clientY};onpointerup=()=>drag=null;onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*0.006;pit=Math.max(0.05,Math.min(1.3,pit+(e.clientY-drag.y)*0.004));drag={x:e.clientX,y:e.clientY};};
R.domElement.onwheel=e=>{dist=Math.max(5,Math.min(60,dist+e.deltaY*0.02));};
let t=0;const clk=new THREE.Clock();setTimeout(()=>{V.fall(5,1.2);window.__READY=true;},2500);
(function f(){requestAnimationFrame(f);const dt=Math.min(clk.getDelta(),0.05);t+=dt;V.update(dt,null,t);C.position.set(Math.sin(yaw)*dist*Math.cos(pit),1+Math.sin(pit)*dist,Math.cos(yaw)*dist*Math.cos(pit));C.lookAt(0,1.2,0);R.render(S,C);})();
</script></body></html>
