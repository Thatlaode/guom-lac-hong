# nginx — đặt ở /etc/nginx/sites-available/guom-lac-hong rồi bật. Thay TEN_MIEN bằng tên miền thật (vd game.vieesport.vn)
# certbot --nginx sẽ tự thêm phần HTTPS (cần cho Gyro điện thoại).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name TEN_MIEN;

    client_max_body_size 1m;
    gzip off;   # máy chủ game đã tự nén

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Bảng Admin: có thể khóa theo IP văn phòng (bỏ dấu # và sửa IP)
    # location ~ ^/(admin\.html|api/admin/) { allow 1.2.3.4; deny all; proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
}
